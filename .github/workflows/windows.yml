name: Compilar VaoLoad para Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Compilar aplicación y verificar herramientas
        run: python build_windows.py
      - name: Guardar aplicación
        uses: actions/upload-artifact@v4
        with:
          name: VaoLoad-App-Windows
          path: dist/VaoLoad/
          if-no-files-found: error
          retention-days: 14
